<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} · Cover letter · {{COMPANY}}</title>
<meta name="author" content="{{NAME}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- BRAND-FONTS: /setup replaces the one fonts.googleapis.com/css2 link on the next line -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TRUE-TO-PDF LAYOUT, classic cover letter, one A4 page.
   BRAND: /setup edits ONLY the :root block below (colours, fonts)
   and the BRAND-FONTS link above, from profile/brand.md.
   ONE DIAL: if the page spills, drop --pz to .97 or .95.
   ============================================================ */
:root{
  --pz:1;
  --paper:#FFFFFF; --ink:#1A1A1A; --mute:#6B6B6B; --line:#E3E3E3;
  --accent:#2F5BEA; --card:#F4F6FC; --dark:#1A1A1A;
  --disp:"Poppins",Impact,"Arial Black",sans-serif;
  --sans:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:#D9D9D9}
body{margin:0;font-family:var(--sans);font-size:10pt;line-height:1.55;color:var(--ink);
  -webkit-font-smoothing:antialiased}

.page{width:calc(210mm / var(--pz));min-height:calc(297mm / var(--pz));padding:16mm 18mm;
  margin:8mm auto;background:var(--paper);box-shadow:0 2mm 8mm rgba(0,0,0,.18);
  position:relative;zoom:var(--pz)}

p{margin:0 0 1em}
a{color:var(--ink);border-bottom:.5pt solid var(--accent);text-decoration:none}

.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:10mm;
  padding-bottom:5mm;border-bottom:1pt solid var(--accent)}
.mh-name{font-family:var(--disp);font-weight:700;color:var(--accent);font-size:20pt;
  line-height:1;letter-spacing:-.02em;margin:0}
.mh-right{text-align:right;flex-shrink:0}
.mh-logo{width:13mm;height:auto;color:var(--ink);display:block;margin:0 0 2.5mm auto}
.contact{font-size:8.4pt;line-height:1.6;color:var(--mute)}
.contact a{color:var(--ink);font-weight:500}

.meta{display:flex;justify-content:space-between;gap:8mm;margin:8mm 0 7mm;font-size:9pt;color:var(--mute)}
.meta .re{color:var(--ink);font-weight:600}
.meta .re .co{color:var(--accent)}

.letter p{font-size:10pt;line-height:1.55}
.greet{margin-bottom:1.1em}
.closing{margin-top:6mm}
.sign{font-family:var(--disp);font-weight:700;font-size:12pt;letter-spacing:-.01em;margin-top:8mm}

@media screen{
  .toolbar{position:fixed;right:6mm;bottom:6mm}
  .btn{background:var(--accent);color:#fff;border:none;padding:3mm 6mm;border-radius:20mm;
    font-family:var(--sans);font-size:10pt;font-weight:600;cursor:pointer;
    box-shadow:0 2mm 6mm rgba(0,0,0,.28)}
  .btn:hover{background:var(--ink)}
}
@media print{
  @page{size:A4;margin:0}
  html{background:#fff}
  .page{margin:0;box-shadow:none}
  .toolbar{display:none!important}
  a{color:var(--ink)}
}
</style>
</head>
<body>
<!--
PLACEHOLDERS: NAME CONTACT_LINE (html, links separated by " · ") LOGO (inline svg or img with class mh-logo, empty is fine)
ROLE COMPANY DATE GREETING OPENING BODY_1 BODY_2 CLOSE CLOSING_LINE
-->
<div class="page">

  <header class="mast">
    <h1 class="mh-name">{{NAME}}</h1>
    <div class="mh-right">
      {{LOGO}}
      <div class="contact">{{CONTACT_LINE}}</div>
    </div>
  </header>

  <div class="meta">
    <div class="re">Application: {{ROLE}} at <span class="co">{{COMPANY}}</span></div>
    <div>{{DATE}}</div>
  </div>

  <section class="letter">
    <p class="greet">{{GREETING}}</p>
    <p>{{OPENING}}</p>
    <p>{{BODY_1}}</p>
    <p>{{BODY_2}}</p>
    <p>{{CLOSE}}</p>
    <p class="closing">{{CLOSING_LINE}}</p>
    <div class="sign">{{NAME}}</div>
  </section>

</div>

<div class="toolbar">
  <button class="btn" onclick="window.print()">Export PDF</button>
</div>
</body>
</html>
